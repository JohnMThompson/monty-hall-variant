# Set each choice to: stay, switch, or random.
# A random choice uses --switch-probability from the command line.

[traditional]
# Monty reveals an ordinary goat.
ordinary_goat_revealed = switch

[special]
# Monty reveals the ordinary goat, leaving the car and valuable goat concealed.
ordinary_goat_revealed = stay
# Monty reveals the valuable goat, leaving the car and ordinary goat concealed.
valuable_goat_revealed = switch
